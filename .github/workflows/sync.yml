name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC (9:00 AM VN) hàng ngày
  workflow_dispatch:        # Kích hoạt thủ công trên GitHub web bất cứ lúc nào

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream changes
        run: |
          git remote add upstream https://github.com/CloudAI-X/threejs-skills.git || true
          git fetch upstream main
          git merge upstream/main -m "chore: sync upstream changes" -X theirs --no-edit
          git push origin main
